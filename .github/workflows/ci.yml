name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (+ pytest)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install pillars from PyPI (best effort, fallback stdlib offline)
        run: |
          pip install "agent-context-bridge==0.3.2" "cited-rag==0.1.1" "llm-eval-ci==0.1.2" \
            || echo "pillars unavailable offline, tests use stdlib fallback (CVA_FORCE_FALLBACK=1 path)"
          pip show agent-context-bridge cited-rag llm-eval-ci || true
      - name: Run tests (offline, no secrets)
        run: python -m pytest -v
      - name: Run banking compliance demo (offline)
        run: python examples/banking-compliance/demo_banking.py

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Install pillars from PyPI (best effort, fallback stdlib offline)
        run: |
          pip install "agent-context-bridge==0.3.2" "cited-rag==0.1.1" "llm-eval-ci==0.1.2" \
            || echo "pillars unavailable offline, gates use stdlib fallback verified_agent.gates"
          pip show agent-context-bridge cited-rag llm-eval-ci || true
      - name: Gate — non_regression suite
        run: |
          if command -v llm-eval >/dev/null 2>&1; then
            llm-eval run evals/non_regression.json --report report.md --json report.json
          else
            python -m verified_agent.gates run evals/non_regression.json
          fi
      - name: Gate — schema suite
        run: |
          if command -v llm-eval >/dev/null 2>&1; then
            llm-eval run evals/schema.json --report report.md --json report.json
          else
            python -m verified_agent.gates run evals/schema.json
          fi
      - name: Gate — tripwires suite (PII + injection)
        run: |
          if command -v llm-eval >/dev/null 2>&1; then
            llm-eval run evals/tripwires.json --report report.md --json report.json
          else
            python -m verified_agent.gates run evals/tripwires.json
          fi
      - name: Gate — banking_compliance suite
        run: |
          if command -v llm-eval >/dev/null 2>&1; then
            llm-eval run evals/banking_compliance.json --report report.md --json report.json
          else
            python -m verified_agent.gates run evals/banking_compliance.json
          fi
